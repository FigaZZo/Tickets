openapi: 3.0.3
info:
  title: Pricing API
  version: 1.0.0
paths:
  /pricing/quote:
    get:
      operationId: getQuote
      parameters:
        - in: query
          name: eventId
          required: true
          schema:
            type: string
        - in: query
          name: seatNumber
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Price quote
          content:
            application/json:
              schema:
                type: object
                required: [amount, currency]
                properties:
                  amount:
                    type: number
                    format: double
                  currency:
                    type: string
